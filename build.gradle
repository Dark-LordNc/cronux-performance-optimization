plugins { id 'java' }

version = '1.1.0'
base { archivesName = 'cronux-performance' }

repositories { mavenCentral() }

// Aucune dépendance Minecraft : le mod cible les noms officiels (26.x non obfusqué) par réflexion.
dependencies {
    compileOnly('net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7') { transitive = false }
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
}

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
